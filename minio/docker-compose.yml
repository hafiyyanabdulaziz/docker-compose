version: "3.8"

services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    restart: always
    ports:
      - "9002:9000" # API Port
      - "9001:9001" # Console UI Port
    environment:
      MINIO_ROOT_USER: "hafiyyanabdulaziz" # Ganti dengan username pilihan Anda
      MINIO_ROOT_PASSWORD: "MICROSOFTsaya1!" # Ganti dengan password yang kuat
    volumes:
      - ./data:/data # Folder untuk menyimpan file (bucket)
      - ./config:/root/.minio # Folder untuk konfigurasi MinIO
    command: server /data --console-address ":9001"
